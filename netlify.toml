[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/provas/:slug"
  to = "/.netlify/functions/prova?slug=:slug"
  status = 200

[[redirects]]
  from = "/provas/:slug/"
  to = "/.netlify/functions/prova?slug=:slug"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
